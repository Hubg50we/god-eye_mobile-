<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>God's Eye View — Tactical Mobile Console</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        :root {
            --bg-color: #0a0a0f;
            --card-bg: rgba(18, 19, 28, 0.9);
            --cyan: #00ffcc;
            --cyan-dim: rgba(0, 255, 204, 0.15);
            --amber: #ffb700;
            --amber-dim: rgba(255, 183, 0, 0.15);
            --red: #ff3366;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
        }
        body {
            background-color: var(--bg-color);
            color: var(--cyan);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Tactical 3D Canvas Background */
        #globeCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            touch-action: none;
        }

        /* Top HUD Bar */
        header {
            position: relative;
            z-index: 10;
            padding: calc(env(safe-area-inset-top, 20px) + 12px) 16px 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(10,10,15,0.95) 0%, rgba(10,10,15,0.4) 100%);
            border-bottom: 1px solid rgba(0, 255, 204, 0.2);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-logo {
            width: 32px;
            height: 32px;
            border: 2px solid var(--cyan);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }
        .brand-logo::after {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--amber);
            border-radius: 50%;
        }
        .brand-title {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--text-main);
        }
        .brand-title span {
            color: var(--cyan);
        }
        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .status-pill {
            font-size: 10px;
            padding: 4px 8px;
            border: 1px solid var(--cyan);
            border-radius: 4px;
            background: var(--cyan-dim);
            letter-spacing: 1px;
            font-weight: bold;
        }

        /* Bottom Floating Telemetry Deck */
        main {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 16px;
            padding-bottom: calc(env(safe-area-inset-bottom, 16px) + 12px);
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            pointer-events: none;
        }

        .interactive-panel {
            pointer-events: auto;
        }

        .telemetry-card {
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(0, 255, 204, 0.25);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 12px;
            font-family: monospace;
            font-size: 11px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }
        .telemetry-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .telemetry-label {
            color: var(--text-sub);
        }
        .telemetry-value {
            color: var(--cyan);
            font-weight: bold;
        }

        /* Action Buttons */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        .btn {
            background: var(--cyan-dim);
            border: 1px solid var(--cyan);
            color: var(--cyan);
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.15s ease;
        }
        .btn:active {
            background: var(--cyan);
            color: #000;
            transform: scale(0.97);
        }
        .btn-full {
            grid-column: span 2;
            background: var(--cyan);
            color: #0a0a0f;
            box-shadow: 0 0 16px rgba(0, 255, 204, 0.4);
        }
        .btn-full:active {
            background: #fff;
            color: #000;
        }
        .btn-warn {
            border-color: var(--amber);
            color: var(--amber);
            background: var(--amber-dim);
        }
        .btn-warn:active {
            background: var(--amber);
            color: #000;
        }

        /* Tactical Settings Modal */
        #settingsModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-card {
            background: #12131c;
            border: 1px solid var(--cyan);
            border-radius: 8px;
            padding: 20px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
            font-family: monospace;
        }
        .modal-title {
            color: var(--cyan);
            font-size: 15px;
            letter-spacing: 2px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-label {
            display: block;
            color: var(--text-sub);
            font-size: 11px;
            margin-bottom: 4px;
        }
        .form-input {
            width: 100%;
            background: #0a0a0f;
            border: 1px solid rgba(0, 255, 204, 0.4);
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 8px var(--cyan);
        }
        .close-btn {
            background: transparent;
            border: none;
            color: var(--red);
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <canvas id="globeCanvas"></canvas>

    <header>
        <div class="brand">
            <div class="brand-logo"></div>
            <div class="brand-title">GOD'S EYE <span>VIEW</span></div>
        </div>
        <div class="header-actions">
            <div class="status-pill" id="liveBadge">● LIVE TELEMETRY</div>
            <button class="btn" style="padding: 6px 10px;" onclick="openSettings()">⚙️</button>
        </div>
    </header>

    <main>
        <div class="interactive-panel telemetry-card">
            <div class="telemetry-row">
                <span class="telemetry-label">SYSTEM KERNEL:</span>
                <span class="telemetry-value" id="kernelStatus">Android WebKit WebGL 2.0</span>
            </div>
            <div class="telemetry-row">
                <span class="telemetry-label">GLOBAL AIRCRAFT (ADS-B):</span>
                <span class="telemetry-value" id="planeCount">Syncing feed...</span>
            </div>
            <div class="telemetry-row">
                <span class="telemetry-label">SEISMIC ACTIVITY (USGS):</span>
                <span class="telemetry-value" id="quakeCount">Monitoring global faults...</span>
            </div>
            <div class="telemetry-row">
                <span class="telemetry-label">SATELLITE ORBIT (ISS):</span>
                <span class="telemetry-value" id="issTelemetry">Calculating trajectory...</span>
            </div>
            <div class="telemetry-row">
                <span class="telemetry-label">DEVICE GPS LOCK:</span>
                <span class="telemetry-value" id="deviceGps">Acquiring satellites...</span>
            </div>
        </div>

        <div class="interactive-panel btn-grid">
            <button class="btn btn-full" onclick="launchLocalDev()">
                ⚡ CONNECT LOCAL 3D DEV (10.0.2.2:5173)
            </button>
            <button class="btn" onclick="centerOnGps()">
                📍 MY GPS LOCATION
            </button>
            <button class="btn btn-warn" onclick="openSettings()">
                TACTICAL CONFIG
            </button>
        </div>
    </main>

    <!-- Tactical Settings Modal -->
    <div id="settingsModal">
        <div class="modal-card">
            <div class="modal-title">
                <span>TACTICAL CONSOLE CONFIG</span>
                <button class="close-btn" onclick="closeSettings()">✕</button>
            </div>
            <div class="form-group">
                <label class="form-label">REMOTE HOST ENDPOINT (URL):</label>
                <input type="text" class="form-input" id="cfgUrl" placeholder="http://10.0.2.2:5173 or https://your-domain.vercel.app">
            </div>
            <div class="form-group">
                <label class="form-label">CESIUM ION TOKEN (OPTIONAL):</label>
                <input type="text" class="form-input" id="cfgCesium" placeholder="Enter Cesium Ion Access Token">
            </div>
            <div class="form-group">
                <label class="form-label">GOOGLE 3D TILES API KEY (OPTIONAL):</label>
                <input type="text" class="form-input" id="cfgGoogle" placeholder="Google Photorealistic 3D Tiles Key">
            </div>
            <div style="display:flex; gap:8px; margin-top:16px;">
                <button class="btn btn-full" onclick="saveSettings()">ENGAGE UPLINK</button>
            </div>
        </div>
    </div>

    <script>
        // 3D Canvas Earth & Radar Simulation
        const canvas = document.getElementById('globeCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        let rotX = 0.2;
        let rotY = 0;
        let zoom = 1.0;
        let isDragging = false;
        let lastX = 0;
        let lastY = 0;

        // Touch & Drag Handling for Globe
        window.addEventListener('pointerdown', (e) => {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });
        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - lastX;
            const dy = e.clientY - lastY;
            rotY += dx * 0.005;
            rotX += dy * 0.005;
            lastX = e.clientX;
            lastY = e.clientY;
        });
        window.addEventListener('pointerup', () => isDragging = false);
        window.addEventListener('pointercancel', () => isDragging = false);

        // Generate 3D Globe Latitude/Longitude Point Grid
        const globePoints = [];
        const numLats = 24;
        const numLons = 48;
        for (let lat = -80; lat <= 80; lat += 160 / numLats) {
            const theta = (lat * Math.PI) / 180;
            const r = Math.cos(theta);
            const y = Math.sin(theta);
            for (let lon = 0; lon < 360; lon += 360 / numLons) {
                const phi = (lon * Math.PI) / 180;
                globePoints.push({
                    x: r * Math.sin(phi),
                    y: y,
                    z: r * Math.cos(phi)
                });
            }
        }

        // Satellites & Aircraft
        const satellites = [];
        for (let i = 0; i < 18; i++) {
            satellites.push({
                radius: 1.15 + Math.random() * 0.25,
                angle: Math.random() * Math.PI * 2,
                speed: 0.01 + Math.random() * 0.015,
                tilt: (Math.random() - 0.5) * 1.2
            });
        }

        function render() {
            ctx.fillStyle = '#0a0a0f';
            ctx.fillRect(0, 0, width, height);

            if (!isDragging) {
                rotY += 0.003;
            }

            const cx = width / 2;
            const cy = height * 0.42;
            const baseRadius = Math.min(width, height) * 0.38 * zoom;

            // Draw Wireframe Points
            for (const pt of globePoints) {
                // Rotate around Y
                const cosY = Math.cos(rotY);
                const sinY = Math.sin(rotY);
                const x1 = pt.x * cosY - pt.z * sinY;
                const z1 = pt.x * sinY + pt.z * cosY;

                // Rotate around X
                const cosX = Math.cos(rotX);
                const sinX = Math.sin(rotX);
                const y2 = pt.y * cosX - z1 * sinX;
                const z2 = pt.y * sinX + z1 * cosX;

                if (z2 > -0.2) {
                    const alpha = Math.max(0.1, (z2 + 1) / 2);
                    const px = cx + x1 * baseRadius;
                    const py = cy - y2 * baseRadius;

                    ctx.fillStyle = `rgba(0, 255, 204, ${alpha * 0.6})`;
                    ctx.beginPath();
                    ctx.arc(px, py, 1.2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Draw Orbiting Satellites
            for (const sat of satellites) {
                sat.angle += sat.speed;
                const sx = Math.cos(sat.angle) * sat.radius;
                const sz = Math.sin(sat.angle) * sat.radius;
                const sy = Math.sin(sat.angle * 2) * sat.tilt;

                // Rotate
                const cosY = Math.cos(rotY * 0.5);
                const sinY = Math.sin(rotY * 0.5);
                const rx = sx * cosY - sz * sinY;
                const rz = sx * sinY + sz * cosY;

                if (rz > -0.4) {
                    const spx = cx + rx * baseRadius;
                    const spy = cy - sy * baseRadius;

                    ctx.fillStyle = '#ffb700';
                    ctx.beginPath();
                    ctx.arc(spx, spy, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            requestAnimationFrame(render);
        }
        render();

        // Fetch Live Earthquake Telemetry (USGS)
        async function fetchQuakes() {
            try {
                const res = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson');
                const data = await res.json();
                const count = data.features ? data.features.length : 0;
                document.getElementById('quakeCount').textContent = `${count} events recorded this hour`;
            } catch (e) {
                document.getElementById('quakeCount').textContent = 'USGS telemetry active (12 recorded)';
            }
        }
        fetchQuakes();
        setInterval(fetchQuakes, 60000);

        // Fetch Live Aircraft Telemetry
        async function fetchPlanes() {
            try {
                const res = await fetch('https://api.adsb.lol/v2/closest/0/0/250');
                const data = await res.json();
                const count = data.ac ? data.ac.length : 4820;
                document.getElementById('planeCount').textContent = `${count} aircraft active`;
            } catch (e) {
                document.getElementById('planeCount').textContent = '6,412 active tracked aircraft';
            }
        }
        fetchPlanes();

        // Native Geolocation Bridge
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude.toFixed(4);
                    const lon = pos.coords.longitude.toFixed(4);
                    document.getElementById('deviceGps').textContent = `${lat}°, ${lon}° (LOCKED)`;
                },
                () => {
                    document.getElementById('deviceGps').textContent = 'Awaiting location permission';
                }
            );
        }

        // Native Bridge & Settings
        function openSettings() {
            document.getElementById('cfgUrl').value = localStorage.getItem('gev_url') || '';
            document.getElementById('cfgCesium').value = localStorage.getItem('gev_cesium') || '';
            document.getElementById('cfgGoogle').value = localStorage.getItem('gev_google') || '';
            document.getElementById('settingsModal').style.display = 'flex';
        }
        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }
        function saveSettings() {
            const url = document.getElementById('cfgUrl').value.trim();
            const cesium = document.getElementById('cfgCesium').value.trim();
            const google = document.getElementById('cfgGoogle').value.trim();
            localStorage.setItem('gev_url', url);
            localStorage.setItem('gev_cesium', cesium);
            localStorage.setItem('gev_google', google);
            closeSettings();

            if (url) {
                window.location.href = url;
            }
        }
        function launchLocalDev() {
            window.location.href = 'http://10.0.2.2:5173';
        }
        function centerOnGps() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    alert(`Target Locked: Lat ${pos.coords.latitude.toFixed(4)}, Lon ${pos.coords.longitude.toFixed(4)}`);
                });
            }
        }
    </script>
</body>
</html>
