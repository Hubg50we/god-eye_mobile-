name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Copy Latest Web UI to Android Assets
        run: |
          mkdir -p android/app/src/main/assets/web
          cp web/index.html android/app/src/main/assets/web/index.html

      - name: Generate Wrapper and Build APK
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Extract Version from Gradle
        id: get_version
        run: |
          VER_NAME=$(grep -o 'versionName *"[^"]*"' android/app/build.gradle | cut -d'"' -f2)
          VER_CODE=$(grep -o 'versionCode *[0-9]*' android/app/build.gradle | awk '{print $2}')
          echo "VERSION_NAME=$VER_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VER_CODE" >> $GITHUB_ENV
          echo "Extracted Version: $VER_NAME (code: $VER_CODE)"

      - name: Find and Prepare APK
        id: find_apk
        run: |
          mkdir -p release_bin
          APK_FILE=$(find android/app/build/outputs/apk/debug/ -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            cp "$APK_FILE" release_bin/godseye-android.apk
            cp "$APK_FILE" "release_bin/godseye-android-v${VERSION_NAME}.apk"
          else
            echo "Error: No APK file generated!"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: godseye-android-v${{ env.VERSION_NAME }}
          path: release_bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        with:
          tag_name: "v${{ env.VERSION_NAME }}"
          name: "God's Eye View Mobile APK Release v${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})"
          make_latest: true
          body: |
            ### 🌐 God's Eye View Mobile Tactical Intelligence APK v${{ env.VERSION_NAME }}
            
            Download `godseye-android.apk` (or `godseye-android-v${{ env.VERSION_NAME }}.apk`) below and install it directly on your Android device!
            
            - **App Name**: God's Eye View Mobile
            - **Package**: `com.hubg50we.godseye`
            - **Version**: `v${{ env.VERSION_NAME }}` (Build `${{ env.VERSION_CODE }}`)
            - **Platform**: Android 7.0+ (Universal ARM & x86)
            - **Features**: Interactive 3D Tactical Particle Globe, Live USGS Earthquakes, Live ADS-B Aircraft Tracking, ISS Satellite Telemetry, Hardware-Accelerated WebGL 2.0 WebView.
          files: |
            release_bin/godseye-android.apk
            release_bin/godseye-android-v${{ env.VERSION_NAME }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
