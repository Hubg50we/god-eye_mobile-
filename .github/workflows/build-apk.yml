name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Copy Latest Web UI to Android Assets
        run: |
          mkdir -p android/app/src/main/assets/web
          cp web/index.html android/app/src/main/assets/web/index.html

      - name: Generate Wrapper and Build APK
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find and Prepare APK
        run: |
          mkdir -p release_bin
          cp $(find android/app/build/outputs/apk/debug/ -type f -name "*.apk" | head -n 1) release_bin/godseye-android.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: godseye-android-apk
          path: release_bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        with:
          files: release_bin/godseye-android.apk
          name: God's Eye View Mobile APK Release ${{ github.ref_name }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
